[project]
name = "financial-manager"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2",
    "pdfplumber",
    "python-multipart",
]

[dependency-groups]
dev = ["pytest", "httpx", "fpdf2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
